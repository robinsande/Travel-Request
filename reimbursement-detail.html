<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reimbursement Request Details — CARE TAR</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="app-shell"></div>

  <div id="page-content" class="page-content" hidden>
    <div id="detail-loading"></div>
    <div id="detail-content" hidden></div>

    <div id="decision-section" class="detail-section" hidden>
      <h2>Review Decision</h2>
      <div id="decision-error" class="alert alert--error" hidden role="alert"></div>
      <div class="form-group approval-signature-field" id="reimbursement-approval-signature-field" hidden>
        <label>Approver Signature</label>
        <canvas class="signature-pad" width="520" height="150" aria-label="Draw approval signature"></canvas>
        <input type="file" class="signature-upload" accept="image/*,.svg,image/svg+xml" />
        <input type="text" class="signature-text-input" placeholder="Or type your full name as a digital signature" autocomplete="off" />
        <input type="hidden" class="signature-value" />
        <button type="button" class="btn btn--ghost btn--sm clear-signature-btn">Clear signature</button>
        <label class="checkbox-label"><input type="checkbox" class="save-signature-for-future" /> Save this image signature to my account for future use</label>
        <p class="form-hint">Your saved account signature is loaded automatically. Draw or upload a replacement if needed.</p>
      </div>
      <div class="form-group">
        <label for="decision-comment">Comment / decline reason</label>
        <textarea id="decision-comment" rows="3" placeholder="A reason is required when declining."></textarea>
      </div>
      <div class="detail-actions">
        <button type="button" class="btn btn--success" id="approve-btn">Approve</button>
        <button type="button" class="btn btn--danger" id="reject-btn">Reject</button>
        <button type="button" class="btn btn--primary" id="complete-payment-btn" hidden>Mark Payment Completed</button>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api/http.js"></script>
  <script src="js/api/users.js"></script>
  <script src="js/api/requests.js"></script>
  <script src="js/api/reimbursements.js"></script>
  <script src="js/api/notifications.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/requests.js"></script>
  <script src="js/reimbursements.js"></script>
  <script src="js/notifications.js"></script>
  <script>
    if (!requireAuth()) throw new Error('auth');

    const reimbursementId = new URLSearchParams(window.location.search).get('id');
    if (!reimbursementId) {
      window.location.href = 'reimbursements.html';
      throw new Error('no id');
    }

    const user = getUser();
    const activeNav =
      user.role === 'superadmin'
        ? 'all-reimbursements'
        : user.roles?.includes('auditor')
          ? 'all-reimbursements'
        : ['admin', 'approver_budget_holder'].includes(user.role) ||
            (user.roles || []).some((role) => ['supervisor', 'finance_admin'].includes(role))
          ? 'reimbursement-approvals'
          : 'my-reimbursements';
    renderAppShell(activeNav);
    mountPageContent('#page-content');

    const loadingEl = document.getElementById('detail-loading');
    const contentEl = document.getElementById('detail-content');
    const decisionSection = document.getElementById('decision-section');
    const decisionError = document.getElementById('decision-error');
    const commentEl = document.getElementById('decision-comment');
    const approveBtn = document.getElementById('approve-btn');
    const rejectBtn = document.getElementById('reject-btn');
    const completePaymentBtn = document.getElementById('complete-payment-btn');
    const approvalSignatureField = document.getElementById('reimbursement-approval-signature-field');
    let getApprovalSignature = () => '';
    const approvalSignatureReady = initializeApprovalSignaturePads(decisionSection);
    approvalSignatureReady.then((getSignature) => {
      getApprovalSignature = getSignature || (() => '');
    });

    let currentReport = null;

    function canReview(report) {
      return canApproveReimbursement(report, user);
    }

    async function loadDetail() {
      showPageLoading(loadingEl);

      try {
        const result = await fetchReimbursement(reimbursementId);
        currentReport = result.data || result;
        loadingEl.innerHTML = '';
        contentEl.innerHTML = renderReimbursementDetail(currentReport);
        const extraActions = [];
        extraActions.push('<button type="button" class="btn btn--secondary" id="download-reimbursement-pdf">Download PDF</button>');
        extraActions.push('<button type="button" class="btn btn--secondary" id="download-payment-voucher">Download Payment Voucher</button>');
        extraActions.push('<button type="button" class="btn btn--secondary" id="print-payment-voucher">Print Payment Voucher</button>');
        const submittedById = currentReport.submittedBy?._id ||
          currentReport.submittedBy?.id ||
          currentReport.submittedBy;
        const currentUserId = user.id || user._id;
        const isOwner = String(submittedById || '') === String(currentUserId || '');
        if (isOwner && ['pending', 'rejected', 'SUPERVISOR_DECLINED', 'LINE_MANAGER_DECLINED', 'FINANCE_DECLINED'].includes(currentReport.status)) {
          extraActions.push(`<a href="reimbursement-new.html?id=${encodeURIComponent(reimbursementId)}" class="btn btn--primary" id="edit-reimbursement-btn">Edit</a>`);
        }
        contentEl.innerHTML += `<div class="detail-actions">${extraActions.join('')}</div>`;
        if (isOwner && currentReport.status !== 'COMPLETED') {
          const hasOtherExpenses = (currentReport.lineItems || []).some(
            (item) => item.category === 'OTHER EXPENSES'
          );
          contentEl.innerHTML += `
            <section class="detail-section">
              <h2>Upload Optional Supporting Document</h2>
              <p class="form-hint">Upload only documents you have. Receipts/tickets stay separate for Finance. If this report includes an Other Expenses line, its supporting PDF or image is added after the approved TAR in the merged PDF. Back-to-Office Reports and Terms of Reference stay separate for the Line Manager.</p>
              <form id="reimbursement-attachment-form">
                <div class="form-grid">
                  <div class="form-group">
                    <label for="attachment-document-type">Document type</label>
                    <select id="attachment-document-type" required>
                      <option value="receipt_ticket">Receipt / ticket (Finance)</option>
                      ${hasOtherExpenses ? '<option value="expense_document">Other expense support (merged for Finance)</option>' : ''}
                      <option value="back_to_office">Back-to-Office Report (Line Manager)</option>
                      <option value="terms_of_reference">Terms of Reference (Line Manager)</option>
                      <option value="other">Other supporting document</option>
                    </select>
                  </div>
                  <div class="form-group" id="other-attachment-audience-group" hidden>
                    <label for="attachment-category">Visible to</label>
                    <select id="attachment-category">
                      <option value="financial">Finance Admin</option>
                      <option value="line_manager">Line Manager</option>
                      <option value="supervisor">Supervisor</option>
                    </select>
                  </div>
                  <div class="form-group">
                    <label for="reimbursement-attachment-file">Document</label>
                    <input id="reimbursement-attachment-file" type="file" accept=".pdf,.png,.jpg,.jpeg,.doc,.docx,.xls,.xlsx" required />
                  </div>
                </div>
                <button type="submit" class="btn btn--secondary">Upload document</button>
              </form>
            </section>`;
          const attachmentTypeSelect = document.getElementById('attachment-document-type');
          const otherAudienceGroup = document.getElementById('other-attachment-audience-group');
          const attachmentCategorySelect = document.getElementById('attachment-category');
          const attachmentFileInput = document.getElementById('reimbursement-attachment-file');
          const updateOtherAttachmentAudience = () => {
            const isOther = attachmentTypeSelect.value === 'other';
            otherAudienceGroup.hidden = !isOther;
            attachmentCategorySelect.required = isOther;
            attachmentFileInput.accept = attachmentTypeSelect.value === 'expense_document'
              ? '.pdf,.png,.jpg,.jpeg'
              : '.pdf,.png,.jpg,.jpeg,.doc,.docx,.xls,.xlsx';
          };
          attachmentTypeSelect.addEventListener('change', updateOtherAttachmentAudience);
          updateOtherAttachmentAudience();
          document.getElementById('reimbursement-attachment-form')?.addEventListener('submit', async (event) => {
            event.preventDefault();
            const file = document.getElementById('reimbursement-attachment-file').files[0];
            if (!file) return;
            const documentType = attachmentTypeSelect.value;
            const defaultAudience = {
              receipt_ticket: 'financial',
              expense_document: 'financial',
              back_to_office: 'line_manager',
              terms_of_reference: 'line_manager',
            };
            const category = defaultAudience[documentType] || attachmentCategorySelect.value;
            try {
              await uploadReimbursementAttachment(
                reimbursementId,
                file,
                category,
                documentType
              );
              showToast('Supporting document uploaded.', 'success');
              await loadDetail();
            } catch (error) {
              showToast(error.message || 'Failed to upload the supporting document.', 'error');
            }
          });
        }
        contentEl.querySelectorAll('[data-download-attachment]').forEach((button) => {
          button.addEventListener('click', async () => {
            try {
              await downloadReimbursementAttachment(
                reimbursementId,
                button.dataset.downloadAttachment,
                button.dataset.attachmentName
              );
            } catch (error) {
              showToast(error.message || 'Failed to download the document.', 'error');
            }
          });
        });
        contentEl.querySelectorAll('[data-preview-attachment]').forEach((button) => {
          button.addEventListener('click', async () => {
            try {
              await previewReimbursementAttachment(
                reimbursementId,
                button.dataset.previewAttachment
              );
            } catch (error) {
              showToast(error.message || 'Failed to preview the document.', 'error');
            }
          });
        });
        contentEl.hidden = false;
        document.getElementById('download-reimbursement-pdf')?.addEventListener('click', async () => {
          try {
            await fetchReimbursementPdf(reimbursementId);
          } catch (err) {
            showToast(err.message || 'Failed to download PDF.', 'error');
          }
        });
        document.getElementById('download-payment-voucher')?.addEventListener('click', async () => {
          try {
            await fetchPaymentVoucherPdf(reimbursementId);
          } catch (err) {
            showToast(err.message || 'Failed to download payment voucher.', 'error');
          }
        });
        document.getElementById('print-payment-voucher')?.addEventListener('click', async () => {
          try {
            await previewPaymentVoucherPdf(reimbursementId);
          } catch (err) {
            showToast(err.message || 'Failed to open payment voucher for printing.', 'error');
          }
        });

        const canComplete = canCompleteReimbursementPayment(currentReport, user);
        decisionSection.hidden = !canReview(currentReport) && !canComplete;
        approveBtn.hidden = canComplete;
        rejectBtn.hidden = canComplete;
        completePaymentBtn.hidden = !canComplete;
        const needsReviewStart = [
          'SUBMITTED_TO_SUPERVISOR',
          'SUBMITTED_TO_LINE_MANAGER',
          'SUBMITTED_TO_FINANCE',
        ].includes(currentReport.status);
        approveBtn.textContent = needsReviewStart ? 'Start Review' : 'Approve';
        rejectBtn.textContent = 'Reject';
        rejectBtn.hidden = canComplete || needsReviewStart;
        approvalSignatureField.hidden = canComplete || needsReviewStart;
      } catch (err) {
        loadingEl.innerHTML = '';
        showToast(err.message || 'Failed to load reimbursement request.', 'error');
      }
    }

    async function submitDecision(status, button) {
      decisionError.hidden = true;
      const comment = commentEl.value.trim();

      if (status === 'rejected' && !comment) {
        renderApiErrors(decisionError, { message: 'A rejection comment is required.' });
        return;
      }
      if (status === 'approved') await approvalSignatureReady;
      const signature = status === 'approved' ? getApprovalSignature().trim() : '';
      if (status === 'approved' && !signature) {
        renderApiErrors(decisionError, { message: 'Your saved or drawn signature is required before approval.' });
        return;
      }

      const confirmMessages = {
        review_started: 'Start reviewing this reimbursement package?',
        approved: 'Approve this reimbursement request?',
        rejected: 'Reject this reimbursement request?',
        completed: 'Mark this reimbursement payment as completed?',
      };

      if (!confirmAction(confirmMessages[status])) return;
      setLoading(
        button,
        true,
        status === 'review_started'
          ? 'Starting review…'
          : status === 'approved'
            ? 'Approving…'
            : status === 'rejected'
              ? 'Declining…'
              : 'Completing…'
      );

      try {
        await updateReimbursementStatus(reimbursementId, {
          status,
          comment: comment || undefined,
          signature: signature || undefined,
        });
        showToast(
          status === 'review_started'
            ? 'Reimbursement review started.'
            : status === 'approved'
              ? 'Reimbursement request approved.'
              : status === 'rejected'
                ? 'Reimbursement request declined.'
                : 'Payment marked complete.',
          'success'
        );
        commentEl.value = '';
        if (typeof refreshApprovalBadges === 'function') refreshApprovalBadges();
        loadDetail();
      } catch (err) {
        renderApiErrors(decisionError, err);
      } finally {
        setLoading(button, false);
      }
    }

    approveBtn.addEventListener('click', () => {
      const status = [
        'SUBMITTED_TO_SUPERVISOR',
        'SUBMITTED_TO_LINE_MANAGER',
        'SUBMITTED_TO_FINANCE',
      ].includes(currentReport?.status)
        ? 'review_started'
        : 'approved';
      submitDecision(status, approveBtn);
    });
    rejectBtn.addEventListener('click', () => submitDecision('rejected', rejectBtn));
    completePaymentBtn.addEventListener('click', () => submitDecision('completed', completePaymentBtn));

    loadDetail();
  </script>
</body>
</html>
