<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Approvals — Travel Requests — CARE TAR</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="app-shell"></div>

  <div id="page-content" class="page-content" hidden>
    <div class="page-header">
      <div>
        <span class="section-kicker">DECISION QUEUE</span>
        <h1>Travel approvals</h1>
        <p class="page-header__subtitle">Review requests waiting for an authorized decision.</p>
      </div>
    </div>
    <div class="btn-group" id="superadmin-reminder-actions" hidden>
      <button type="button" class="btn btn--secondary" id="remind-all-pending-btn">Email reminders for all pending TARs</button>
    </div>
    <div id="approvals-subnav"></div>
    <p class="text-muted">Assigned admins can approve or reject. Super Admins have a read-only oversight view.</p>

    <div id="approvals-loading"></div>
    <div id="approvals-list"></div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api/http.js"></script>
  <script src="js/api/requests.js"></script>
  <script src="js/api/notifications.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/requests.js"></script>
  <script src="js/notifications.js"></script>
  <script>
    if (!requireAuth(['admin', 'superadmin'])) throw new Error('auth');

    const user = getUser();
    initProtectedPage('approvals');
    document.getElementById('approvals-subnav').innerHTML = renderApprovalsSubnav('travel');

    const loadingEl = document.getElementById('approvals-loading');
    const listEl = document.getElementById('approvals-list');
    const EMPTY_MESSAGE = 'No pending travel request approvals.';
    const remindAllButton = document.getElementById('remind-all-pending-btn');
    if (user.role === 'superadmin') {
      document.getElementById('superadmin-reminder-actions').hidden = false;
      remindAllButton.addEventListener('click', async () => {
        if (!confirmAction('Send reminder emails for every pending TAR to its assigned approver?')) return;
        setLoading(remindAllButton, true, 'Sending…');
        try {
          const result = await remindAllPendingApprovers();
          showToast(`${result.sent} reminder email(s) sent. ${result.skipped} request(s) skipped.`, result.failed ? 'warning' : 'success');
        } catch (err) {
          showToast(err.message || 'Failed to send pending TAR reminders.', 'error');
        } finally {
          setLoading(remindAllButton, false);
        }
      });
    }

    function removeApprovalCard(card) {
      card.remove();
      if (!listEl.children.length) {
        showEmptyState(listEl, EMPTY_MESSAGE);
      }
      if (typeof refreshApprovalBadges === 'function') refreshApprovalBadges();
    }

    async function loadApprovals() {
      showPageLoading(loadingEl);
      listEl.innerHTML = '';

      try {
        const result = await fetchPendingApprovals();
        const requests = unwrapListResult(result, ['requests']);

        loadingEl.innerHTML = '';

        if (!requests.length) {
          showEmptyState(listEl, EMPTY_MESSAGE);
        } else {
          listEl.innerHTML = requests
            .map((request) => renderRequestRow(request, { showApproveActions: user.role === 'admin' }))
            .join('');
          if (user.role === 'admin') {
            bindTravelApprovalActions(listEl, {
              onSuccess: (card) => removeApprovalCard(card),
            });
          }
        }
        if (typeof refreshApprovalBadges === 'function') refreshApprovalBadges();
      } catch (err) {
        loadingEl.innerHTML = '';
        showToast(err.message || 'Failed to load travel request approvals.', 'error');
      }
    }

    loadApprovals();
  </script>
</body>
</html>
