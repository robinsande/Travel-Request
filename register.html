<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account — CARE TAR</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="auth-page">
  <div class="auth-card">
    <div class="auth-card__brand"><span class="auth-card__logo">CARE</span><span class="auth-card__title">Kenya Travel Authority Request</span></div>
    <h1>Create Account</h1>
    <p class="text-muted">Create a staff account. New accounts start as normal users; a superadmin can assign another role later.</p>
    <div id="register-error" class="alert alert--error" hidden role="alert"></div>
    <form id="register-form" autocomplete="off" novalidate>
      <div class="form-group"><label for="name">Full name</label><input type="text" id="name" name="name" required autocomplete="off" /></div>
      <div class="form-group"><label for="email">Email address</label><input type="email" id="email" name="email" required autocomplete="off" /></div>
      <div class="form-group"><label for="password">Password</label><input type="password" id="password" name="password" required minlength="8" autocomplete="off" /></div>
      <div class="form-group"><label for="confirm-password">Confirm password</label><input type="password" id="confirm-password" required minlength="8" autocomplete="off" /></div>
      <button type="submit" class="btn btn--primary btn--block" id="register-btn">Create account</button>
    </form>
    <p class="form-hint" style="margin-top: 1.5rem; text-align: center;">Already have an account? <a href="login.html">Sign in</a></p>
  </div>
  <script src="js/config.js"></script>
  <script src="js/api/http.js"></script>
  <script src="js/api/auth.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script>
    redirectIfAuthenticated();
    const form = document.getElementById('register-form');
    const errorEl = document.getElementById('register-error');
    const button = document.getElementById('register-btn');
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      errorEl.hidden = true;
      if (form.password.value !== document.getElementById('confirm-password').value) {
        renderApiErrors(errorEl, { message: 'Passwords do not match.' });
        return;
      }
      setLoading(button, true, 'Creating…');
      try {
        const result = await register(form.name.value.trim(), form.email.value.trim(), form.password.value);
        form.reset();
        setAuth(result.token, result.user);
        window.location.href = 'dashboard.html';
      } catch (error) {
        renderApiErrors(errorEl, error);
      } finally {
        setLoading(button, false);
      }
    });
  </script>
</body>
</html>
