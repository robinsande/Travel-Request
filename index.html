<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>CARE Travel Authorization Request</title>
</head>
<body>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script>
    const user = getUser();
    const destination = getToken()
      ? user?.mustSetPassword
        ? 'profile.html'
        : getLastAuthenticatedPage() || 'dashboard.html'
      : 'login.html';
    const destinationUrl = new URL(destination, window.location.href);
    if (!getToken()) {
      destinationUrl.search = window.location.search;
      destinationUrl.hash = window.location.hash;
    }
    window.location.replace(destinationUrl.href);
  </script>
</body>
</html>
