<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Sign In — CARE TAR</title>
</head>
<body>
  <p>Redirecting to <a id="sign-in-link" href="login.html">sign in</a>…</p>
  <script>
    const signInUrl = new URL('login.html', window.location.href);
    signInUrl.search = window.location.search;
    signInUrl.hash = window.location.hash;
    document.getElementById('sign-in-link').href = signInUrl.href;
    window.location.replace(signInUrl.href);
  </script>
</body>
</html>
