<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CARE Travel Authority Request</title>
  <style>
    :root {
      --color-primary: #ea7a1a;
      --color-purple: #4d1d69;
      --color-text: #ffffff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Calibri', 'Segoe UI', sans-serif;
      background:
        linear-gradient(135deg, rgba(78, 39, 88, 0.75), rgba(234, 122, 26, 0.58)),
        url('https://images.unsplash.com/photo-1527631746610-bca00a040d60?auto=format&fit=crop&w=1600&q=80') center/cover no-repeat fixed;
      color: var(--color-text);
    }

    .landing-message {
      padding: 1.1rem 1.6rem;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.32);
      backdrop-filter: blur(8px);
      box-shadow: 0 18px 40px rgba(24, 16, 33, 0.22);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-weight: 700;
      font-size: 0.82rem;
    }
  </style>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script>
    if (getToken()) {
      window.location.replace('dashboard.html');
    } else {
      window.location.replace('login.html');
    }
  </script>
</head>
<body class="travel-bg landing-page">
  <div class="landing-message">Redirecting…</div>
</body>
</html>
