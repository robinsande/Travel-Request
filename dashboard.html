<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — CARE TAR</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="travel-bg dashboard-page">
  <div id="app-shell"></div>

  <div id="page-content" class="page-content" hidden>
    <div class="page-header">
      <div>
        <h1 id="dashboard-title">Dashboard</h1>
      </div>
    </div>
    <div id="dashboard-loading"></div>
    <section class="dashboard-metrics" id="dashboard-metrics" aria-label="Dashboard metrics"></section>
    <section class="dashboard-grid">
      <div class="dashboard-panel">
        <div class="dashboard-panel__heading"><h2>Quick actions</h2><span>→</span></div>
        <div class="dashboard-actions" id="dashboard-actions"></div>
      </div>
      <div class="dashboard-panel">
        <div class="dashboard-panel__heading"><h2>Recent activity</h2><span>◷</span></div>
        <div id="dashboard-activity" class="dashboard-activity"></div>
      </div>
    </section>

  </div>

  <script src="js/config.js"></script>
  <script src="js/api/http.js"></script>
  <script src="js/api/auth.js"></script>
  <script src="js/api/users.js"></script>
  <script src="js/api/requests.js"></script>
  <script src="js/api/notifications.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/notifications.js"></script>
  <script>
    if (!requireAuth()) throw new Error('auth');

    renderAppShell('dashboard');
    mountPageContent('#page-content');

    const dashboardLoading = document.getElementById('dashboard-loading');
    const metricsEl = document.getElementById('dashboard-metrics');
    const actionsEl = document.getElementById('dashboard-actions');
    const activityEl = document.getElementById('dashboard-activity');
    const dashboardUser = getUser();

    function metricCard(label, value, tone, link) {
      return `<a class="dashboard-metric dashboard-metric--${tone}" href="${link}"><span>${label}</span><strong>${value}</strong><small>Open workspace →</small></a>`;
    }

    function actionLink(label, href, icon) {
      return `<a class="dashboard-action" href="${href}"><span class="dashboard-action__icon">${icon}</span><span>${label}</span><span>→</span></a>`;
    }

    function renderDashboard(data) {
      const isSuperadmin = dashboardUser?.role === 'superadmin';
      const requests = Array.isArray(data.requests?.data) ? data.requests.data : Array.isArray(data.requests) ? data.requests : [];
      const pending = Array.isArray(data.pending?.data) ? data.pending.data : Array.isArray(data.pending) ? data.pending : [];
      const users = Array.isArray(data.users?.data) ? data.users.data : Array.isArray(data.users) ? data.users : [];
      const approved = requests.filter((request) => request.status === 'approved').length;
      const pendingCount = isSuperadmin ? requests.filter((request) => request.status === 'pending').length : pending.length;
      const usersCount = users.length;

      metricsEl.innerHTML = isSuperadmin
        ? metricCard('Total users', usersCount, 'users', 'admin-users.html') + metricCard('All TARs', requests.length, 'requests', 'requests.html?scope=all') + metricCard('Pending TARs', pendingCount, 'pending', 'requests.html?scope=all&status=pending') + metricCard('Approved TARs', approved, 'approved', 'requests.html?scope=all&status=approved')
        : metricCard('Team TARs', requests.length, 'requests', 'requests.html?scope=team') + metricCard('Awaiting approval', pendingCount, 'pending', 'approvals.html') + metricCard('Approved TARs', approved, 'approved', 'requests.html?scope=team&status=approved');

      actionsEl.innerHTML = isSuperadmin
        ? actionLink('Manage users and roles', 'admin-users.html', '♙') + actionLink('Import employees', 'admin-import.html', '⇧') + actionLink('Review all TARs', 'requests.html?scope=all', '▣')
        : actionLink('Review TAR approvals', 'approvals.html', '✓') + actionLink('View team requests', 'requests.html?scope=team', '♧');

      const activity = (isSuperadmin ? requests : pending).slice(0, 5);
      activityEl.innerHTML = activity.length
        ? activity.map((request) => `<a class="dashboard-activity__item" href="request-detail.html?id=${request._id}"><span>${escapeHtml(request.itinerary?.destination || 'Travel request')}</span><strong>${escapeHtml(String(request.status || 'pending').toUpperCase())}</strong></a>`).join('')
        : '<p class="text-muted">No recent activity to display.</p>';
      dashboardLoading.innerHTML = '';
    }

    async function loadDashboard() {
      showPageLoading(dashboardLoading);
      try {
        if (!dashboardUser) {
          window.location.href = 'login.html';
          return;
        }

        const isSuperadmin = dashboardUser.role === 'superadmin';
        const userListCall = isSuperadmin && typeof fetchAllUsers === 'function'
          ? fetchAllUsers().catch((error) => {
              console.warn('Dashboard user list failed to load:', error);
              return [];
            })
          : Promise.resolve([]);

        const [requestsResult, pendingResult] = await Promise.all([
          fetchMyRequests(isSuperadmin ? { scope: 'all', limit: 100 } : { scope: 'team', limit: 100 }).catch((error) => {
            console.warn('Dashboard requests failed to load:', error);
            return [];
          }),
          isSuperadmin ? Promise.resolve([]) : fetchPendingApprovals().catch((error) => {
            console.warn('Dashboard pending approvals failed to load:', error);
            return [];
          }),
        ]);

        const usersResult = await userListCall;
        renderDashboard({
          requests: requestsResult,
          pending: pendingResult,
          users: usersResult,
        });
      } catch (error) {
        dashboardLoading.innerHTML = '';
        showToast(error?.message || 'Failed to load dashboard.', 'error');
      }
    }

    loadDashboard();
  </script>
</body>
</html>
