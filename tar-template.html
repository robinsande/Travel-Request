<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Preview TAR - CARE TAR</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="tar-template-page">
  <div id="app-shell"></div>

  <main class="page-content" id="page-content" hidden>
    <div class="page-header">
      <div>
        <a href="request-new.html" class="back-link">&larr; New Travel Request</a>
        <h1>Preview TAR</h1>
        <p class="page-header__subtitle">Preview of the Travel Authorization Request form.</p>
      </div>
    </div>

    <div id="template-preview"></div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/api/http.js"></script>
  <script src="js/api/requests.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/requests.js"></script>
  <script>
    if (!requireAuth()) throw new Error('auth');

    initProtectedPage('my-requests');
    document.getElementById('template-preview').innerHTML = renderRequestDetail({
      _id: 'template',
      requestedBy: {},
      project: {},
      selected_budget_holder_id: {},
      budgetHolderDecision: {},
      assignedAreaOfOperation: '',
      employeeOffice: '',
      purposeOfTrip: '',
      modeOfTravel: {},
      itinerary: {},
      passengers: [],
      status: 'pending',
      submittedAt: null,
      decision: {},
    });
    enhanceSmallTarSignatures(document.getElementById('template-preview'));
  </script>
</body>
</html>
