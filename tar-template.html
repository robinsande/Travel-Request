<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Preview TAR - CARE TAR</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="tar-template-page">
  <div id="app-shell"></div>

  <main class="page-content" id="page-content" hidden>
    <div class="page-header">
      <div>
        <a href="request-new.html" class="back-link">&larr; Back to New Travel Request</a>
        <h1>Preview TAR</h1>
        <p class="page-header__subtitle">Preview of the Travel Authorization Request form.</p>
      </div>
    </div>

    <div id="template-preview"></div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/api/http.js"></script>
  <script src="js/api/requests.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/requests.js"></script>
  <script>
    if (!requireAuth()) throw new Error('auth');

    initProtectedPage('my-requests');
    const previewContainer = document.getElementById('template-preview');
    try {
      const request = JSON.parse(sessionStorage.getItem('tar-request-preview') || 'null');
      if (!request) {
        previewContainer.textContent =
          'No TAR details to preview yet. Return to the new TAR form, enter your details, and select Preview TAR.';
      } else {
        previewContainer.innerHTML = renderRequestDetail(request);
        previewContainer.querySelector('.tar-preview-wrap > .back-link')?.remove();
        enhanceSmallTarSignatures(previewContainer);
      }
    } catch (error) {
      console.error('Failed to load TAR preview data.', error);
      previewContainer.textContent =
        'The TAR preview could not be loaded. Return to the form and select Preview TAR again.';
    }
  </script>
</body>
</html>
